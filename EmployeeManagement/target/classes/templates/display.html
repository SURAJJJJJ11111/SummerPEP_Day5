<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Display</title>
</head>

<body>

	<h2>Employee List</h2>

	<table border="1">

		<tr>

			<th>ID</th>
			<th>Name</th>
			<th>Age</th>
			<th>Designation</th>
			<th>Salary</th>

		</tr>

		<tr th:each="e:${employees}">

			<td th:text="${e.id}"></td>
			<td th:text="${e.name}"></td>
			<td th:text="${e.age}"></td>
			<td th:text="${e.designation}"></td>
			<td th:text="${e.salary}"></td>

		</tr>

	</table>

	<br>

	<a href="/">Home</a>

</body>

</html>
